<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TourGuid — Coming soon</title>
<meta name="description" content="TourGuid is coming soon. Log in, or create an account.">
<meta name="theme-color" content="#1E88E5">
<link rel="canonical" href="https://tourguid.net/">
<meta property="og:type" content="website">
<meta property="og:title" content="TourGuid — Coming soon!">
<meta property="og:description" content="TourGuid is coming soon.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Inter ExtraBold, latin subset, served from this site: the page makes no
     third-party request. */
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("/fonts/inter-800.woff2") format("woff2");
  }

  /* The blue is the app's own Login field: the logo's two background stops,
     top to bottom, so the mark sits on the colour it was drawn on. */
  :root {
    --blue-top: #1E88E5;
    --blue-bottom: #0D47A1;
    --on-blue: #FFFFFF;
    --focus: #FFEB3B;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--blue-bottom);
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: linear-gradient(180deg, var(--blue-top) 0%, var(--blue-bottom) 100%);
    color: var(--on-blue);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3.4vmin, 2.25rem);
    padding: max(24px, env(safe-area-inset-top)) 16px 12px;
    text-align: center;
  }

  .logo {
    display: block;
    width: clamp(150px, 30vmin, 380px);
    height: auto;
  }

  /* Sized against the width so it fills a phone and grows to a desktop; the
     cap keeps it inside the window on a very wide screen. */
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.4rem, 10vw, 7.5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .lede {
    margin: 0;
    font-size: clamp(1.05rem, 2.4vmin + 0.4rem, 1.5rem);
    font-weight: 600;
    line-height: 1.35;
  }

  /* Two real links, not a form: the page's policy lets nothing be submitted from here, and the
     sign-in itself lives on app.tourguid.net, where the login is kept. */
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 12rem;
    min-height: 56px;
    padding: 0 28px;
    border: 2px solid var(--on-blue);
    border-radius: 4px;
    font: inherit;
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--on-blue);
    color: var(--blue-bottom);
  }

  .btn-primary:hover { background: #E3F2FD; }

  .btn-outline {
    background: transparent;
    color: var(--on-blue);
  }

  .btn-outline:hover { background: rgba(255, 255, 255, 0.16); }

  .btn:focus-visible,
  .legal a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .note {
    margin: 0;
    max-width: 36ch;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.45;
  }

  .legal {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px 20px;
    margin-top: clamp(0.5rem, 2vmin, 1.5rem);
    font-size: 0.9375rem;
    font-weight: 600;
  }

  .legal a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--on-blue);
    text-underline-offset: 4px;
  }

  @media (max-width: 480px) {
    .btn { width: 100%; max-width: 22rem; }
  }
</style>
</head>
<body>
<!-- site:standalone -->
<main>
  <!-- The approved mark, transparent variant (the pennants and poles only), the
       same paths as TourGuid-Mobile's TourGuidLogo. Not redrawn or recoloured. -->
  <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="TourGuid" xmlns="http://www.w3.org/2000/svg">
    <g>
      <line x1="-30" y1="330" x2="90" y2="5" stroke="#F5F5F5" stroke-width="7" stroke-linecap="round"/>
      <path d="M 80 38 L 450 70 Q 270 210, 68 250 Z" fill="#FF9800"/>
    </g>
    <g>
      <line x1="185" y1="495" x2="275" y2="90" stroke="#F5F5F5" stroke-width="7" stroke-linecap="round"/>
      <path d="M 266 122 L 500 150 Q 380 240, 255 265 Z" fill="#E53935"/>
    </g>
    <g>
      <line x1="20" y1="560" x2="140" y2="235" stroke="#F5F5F5" stroke-width="7" stroke-linecap="round"/>
      <path d="M 130 268 L 500 300 Q 320 440, 118 480 Z" fill="#66BB6A"/>
    </g>
  </svg>
  <h1>COMING SOON!</h1>
  <p class="lede">We're still building TourGuid.</p>
  <div class="actions">
    <a class="btn btn-primary" href="https://app.tourguid.net/trip/#/trips">Log in</a>
    <a class="btn btn-outline" href="https://intro.tourguid.net/#test">Create an account</a>
  </div>
  <p class="note">New accounts are made in the TourGuid app. Sign up to download and test it.</p>
  <nav class="legal" aria-label="Legal and help">
    <a href="https://app.tourguid.net/privacy">Privacy</a>
    <a href="https://app.tourguid.net/terms">Terms</a>
    <a href="https://app.tourguid.net/accessibility">Accessibility</a>
    <a href="mailto:admin@tourguid.net">Support</a>
  </nav>
</main>
</body>
</html>
